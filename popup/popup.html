<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitDone Focus</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="header-brand">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="brand-icon">
          <circle cx="12" cy="12" r="4"></circle>
          <line x1="1.05" y1="12" x2="7" y2="12"></line>
          <line x1="17.01" y1="12" x2="22.96" y2="12"></line>
        </svg>
        <span class="brand-title">GitDone</span>
      </div>
      <button id="popup-btn-options" class="icon-link" title="Open Settings">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </header>

    <!-- Main Focus Session Card -->
    <div class="focus-hero-card">
      <div class="focus-hero-top">
        <div class="status-indicator-wrapper">
          <span class="status-dot" id="popup-status-dot"></span>
          <span class="status-text" id="popup-status-text">Focus Idle</span>
        </div>
        <span class="timer-badge hidden" id="popup-timer-badge">25:00</span>
      </div>

      <div class="quick-timer-buttons" id="timer-btn-group">
        <button id="popup-btn-25" class="timer-btn primary">25m Focus</button>
        <button id="popup-btn-50" class="timer-btn">50m Deep</button>
        <button id="popup-btn-stop" class="timer-btn danger hidden">End Focus</button>
      </div>
    </div>

    <!-- Quick Stats Summary -->
    <div class="popup-stats-row">
      <div class="popup-stat-item">
        <span class="stat-num" id="popup-stat-tasks">0/0</span>
        <span class="stat-desc">Tasks Done</span>
      </div>
      <div class="popup-stat-item">
        <span class="stat-num" id="popup-stat-streak">0d</span>
        <span class="stat-desc">Streak</span>
      </div>
      <div class="popup-stat-item">
        <span class="stat-num" id="popup-stat-blocked">0</span>
        <span class="stat-desc">Blocked</span>
      </div>
    </div>

    <!-- Quick Task Adder -->
    <div class="popup-quick-task">
      <form id="popup-task-form">
        <input type="text" id="popup-task-input" placeholder="+ Quick add task and Enter..." autocomplete="off">
      </form>
    </div>

    <!-- Top Pending Tasks -->
    <div class="popup-tasks-section">
      <div class="tasks-section-header">
        <span>Priority Backlog</span>
        <span class="badge-mini" id="popup-pending-badge">0</span>
      </div>
      <ul class="popup-task-list" id="popup-task-list">
        <!-- Dynamically filled -->
      </ul>
    </div>

    <!-- Footer Actions -->
    <footer class="popup-footer">
      <button id="popup-btn-newtab" class="btn-full">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="9" y1="3" x2="9" y2="21"></line>
        </svg>
        Open Developer Dashboard
      </button>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
